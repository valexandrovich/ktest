apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-common.env: {{ .Values.vault.secrets.commonPath | quote }}
        vault.hashicorp.com/agent-inject-template-common.env: |
          {{`{{- with secret "`}}{{ .Values.vault.secrets.commonPath }}{{`" }}`}}
          {{`{{- range $k, $v := .Data.data }}`}}
          export {{`{{$k}}`}}={{`{{ $v | toJSON }}`}}
          {{`{{- end }}`}}
          {{`{{- end }}`}}
    spec:
      serviceAccountName: {{ include "ktest.serviceAccountName" . }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          command: ["sh", "-c"]
          args:
            - >
              set -a;
              if [ -f /vault/secrets/common.env ]; then . /vault/secrets/common.env; fi;
              set +a;
              exec java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 ${JAVA_OPTS:-} -jar /app/app.jar
          readinessProbe:
            httpGet:
              path: /api/v1/test
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/test
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6