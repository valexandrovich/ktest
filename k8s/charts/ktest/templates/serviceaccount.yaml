apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ktest.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "ktest.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
{{- range .Values.imagePullSecrets }}
  - name: {{ .name }}
{{- end }}
{{- end }}