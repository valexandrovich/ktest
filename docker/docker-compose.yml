name: ktest
services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_ENV_CACHE_BUST: "${WEB_VITE_ENV_FILE:-./env/dev/web.env}"
      secrets:
        - vite_env
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped
    networks:
      - app-network
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - ${API_PORT}:8080
    env_file:
      - "${ENV_DIR:-./env/dev}/common.env"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

secrets:
  vite_env:
    file: ${WEB_VITE_ENV_FILE:-./env/dev/web.env}